<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>设备正在重启 - ZX297520V3</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        body { background-color: #f8fafc; color: #1e293b; line-height: 1.6; padding: 20px; }
        .container { max-width: 520px; margin: 60px auto 0; }
        .card { background: #ffffff; border-radius: 12px; padding: 40px 24px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); border: 1px solid #e2e8f0; text-align: center; }
        .spinner { width: 50px; height: 50px; border: 5px solid #e2e8f0; border-top-color: #2563eb; border-radius: 50%; animation: spin 1s infinite linear; margin: 0 auto 20px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        h2 { font-size: 18px; margin-bottom: 12px; color: #1e293b; }
        p { font-size: 14px; color: #64748b; }
        .countdown-txt { margin-top: 16px; font-size: 14px; color: #2563eb; font-weight: 600; }
    </style>
    <script>
        window.onload = function() {
            var count = 5;
            var el = document.getElementById('countdown');
            var timer = setInterval(function() {
                if (el) el.innerHTML = count + ' 秒后自动尝试重新连接...';
                count--;
                if (count < 0) {
                    clearInterval(timer);
                    location = '/';
                }
            }, 1000);
        };
    </script>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="spinner"></div>
            <h2>设备正在重启...</h2>
            <p>设备已退出 Failsafe 恢复模式并正在执行硬件重启，请稍候。</p>
            <div id="countdown" class="countdown-txt">5 秒后自动尝试重新连接...</div>
        </div>
    </div>
</body>
</html>
